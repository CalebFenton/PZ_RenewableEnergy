# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts and ours
# source this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/RenewableEnergy
DEV_MOD_DIR=dev/RenewableEnergyDevHarness
# Cache dirs under $TMPDIR: <name>-client, <name>-server, <name>-mpclient, <name>-mpserver and
# <name>-check.
CACHE_NAME=pz-renewable-energy
TAG=RETest
# What every game run of the harness checks first: a game started on Lua that doesn't compile, or
# on a script or translation the game rejects, costs a game start to learn what this finds in
# seconds.
PRECHECK=(dev/static-check.sh)
# The static check's rules for this mod's tiles and stash houses, on top of the harness's own.
CHECK_PLUGINS=(dev/check/tiles.py dev/check/stash.py)
# What a kept --stay game loads again for a rerun, relative to the dev mod; the test library sorts
# first, because the test files register their tests through it, and the server's
# RenewableEnergyTestHelpers.lua sorts before the handler files that require it. With --mp the
# server loads the server files again too.
RELOAD_FILES=('42/media/lua/client/RenewableEnergy/Debug/RenewableEnergyTest*.lua'
    '42/media/lua/server/RenewableEnergy/Debug/RenewableEnergyTest*.lua')
# The tests that --changed runs for each changed file: those that reach its code, through the
# fixtures and server handlers too. A file with no entry runs every test; that is left to what
# nearly every test touches, such as Utilities.lua, Specs.lua, Sprites.lua, the PowerBank module,
# Battery.lua, Wear.lua, Items.txt, the tile definitions, the sandbox options, the dev mod's test
# library, setup and scenario, and the server handlers' shared helpers. An empty list marks a file
# no test exercises: art, text that no test reads (dev/static-check.sh checks the translation keys)
