# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts and ours
# source this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/RenewableEnergy
DEV_MOD_DIR=dev/RenewableEnergyDevHarness
# Cache dirs under $TMPDIR: <name>-client, <name>-server, <name>-mpclient, <name>-mpserver and
# <name>-check.
CACHE_NAME=pz-renewable-energy
TAG=RETest
# What a kept --stay game loads again for a rerun, relative to the dev mod; the test library sorts
# first, because the test files register their tests through it. With --mp the server loads the
# server file again too.
RELOAD_FILES=('42/media/lua/client/RenewableEnergy/Debug/RenewableEnergyTest*.lua'
    '42/media/lua/server/RenewableEnergy/Debug/RenewableEnergyTest*.lua')

MODES='promo art loot'
MODE_MARK_promo=REPromo
MODE_SELECTION_promo=PROMO
MODE_MARK_art=REArt
MODE_MARK_loot=RELootReport

# The groups --promo can shoot, as RenewableEnergyDevPromo.lua's GROUP_NAMES line lists them.
harness_check_promo() {
    [ -n "$SELECTION" ] || return 0
    local groups group
    groups=$(sed -n 's/^local GROUP_NAMES = { \(.*\) }$/\1/p' \
        "$DEV_MOD_DIR/42/media/lua/client/RenewableEnergyDevPromo.lua" | tr -d '" ')
    for group in ${SELECTION//,/ }; do
        case ",$groups," in
            *",$group,"*) ;;
            *)
                echo "unknown PROMO group $group; the groups are $groups" >&2
                exit 2
                ;;
        esac
    done
}

harness_after_promo() {
    "$REPO/art/promo/extract.py" "$CACHE"
    echo "PASS: captures are in $REPO/art/promo/captures"
}

harness_after_art() {
    echo "PASS: screenshots are in $CACHE/Screenshots"
}

# validate-server.sh runs the options that switch on more of the mod: stash houses with map items
# and houses stocked from the start, the other charge frequency, and the most battery banks. The
# --mp tests run single player's: the defaults, and no banks in rooms (RenewableEnergyDevHarness.lua's
# onStart, which sets them on the client only).
harness_server_setup() {
    if [ -n "$MP" ]; then
        cat > "$CACHE/Server/${SERVER_NAME}_SandboxVars.lua" <<EOF
SandboxVars = {
    RenewableEnergy = {
        BatteryBankSpawn = 1,
    },
}
EOF
        return
    fi
    cat > "$CACHE/Server/${SERVER_NAME}_SandboxVars.lua" <<EOF
SandboxVars = {
    RenewableEnergy = {
        StashMode = 3,
        ChargeFreq = 2,
        BatteryBankSpawn = 4,
    },
}
EOF
}
# Script and tile warnings name the item, recipe or tileset, and Distributions.lua prints
# "RenewableEnergy: missing" for unknown loot lists. The RenewableEnergy_* battery fields are
# unknown item params on purpose: the game copies them into modData.
SERVER_PROBLEMS='RenewableEnergy: missing|^(WARN|ERROR).*(RenewableEnergy[._ ]|renewable_energy)'
SERVER_IGNORE='adding unknown item param "RenewableEnergy_'
