# shellcheck shell=bash
# What the shared test harness in dev/harness needs to know about this mod; its scripts and ours
# source this. dev/harness/docs/adopting.md describes every key and hook. Paths are relative to the
# repository.

MOD_DIR=Contents/mods/RenewableEnergy
DEV_MOD_DIR=dev/RenewableEnergyDevHarness
# The shared code the mod's mod.info requires, from its own repository checked out beside this
# one: every run and check loads it before the mod, as a player's game does.
LIBRARY_MODS=(../cf_commonlib/Contents/mods/cf_commonlib)
# Prefix of this mod's cache dirs under $TMPDIR.
CACHE_NAME=pz-renewable-energy
TAG=RETest
# The static check's rules for this mod's stash houses, repository layout and tile numbers, on top
# of the harness's own.
CHECK_PLUGINS=(dev/check/stash.py dev/check/repo.py dev/check/sprite_tiles.py)
# What a kept --stay game loads again for a rerun, relative to the dev mod; the test library sorts
# first, because the test files register their tests through it, and the server's
# RenewableEnergyTestHelpers.lua sorts before the handler files that require it. With --mp the
# server loads the server files again too.
RELOAD_FILES=('42/media/lua/client/RenewableEnergy/Debug/RenewableEnergyTest*.lua'
    '42/media/lua/server/RenewableEnergy/Debug/RenewableEnergyTest*.lua')
# The mod's options in a --test world, single player and --mp alike.
TEST_SANDBOX=(
    # Battery Bank Spawn's "None". At its default a room seen for the first time now and then gets
    # a stocked bank (WorldSpawns' OnSeeNewRoom), and one near the start puts a bank in reach of
    # the panels and banks the tests build. The spawn tests place their banks with
    # WorldSpawns.placeBank.
    RenewableEnergy.BatteryBankSpawn=1
    # A house is rolled for lights on the game minute after its surroundings load (BuildingWatch),
    # so one at the edge of the area the tests use can grow lights during a test; at 0 it is still
    # rolled, without lights. The garden light tests promise a house its lights as a solar site
    # does, or set the option themselves.
    RenewableEnergy.GardenLights=0
)
# The tests that --changed runs for each changed file: those that reach its code, through the
# fixtures and server handlers too. Files nearly every test touches name the whole prefix
# renewable_energy_, which runs every test. An empty list marks a file no test exercises. A test
# file selects its own tests, and a harness file no line narrows reaches every test.
# dev/static-check.sh fails on a file with no entry or a glob that matches no file.
