# What a kept --stay game loads again for a rerun, relative to the dev mod; the test library sorts
# first, because the test files register their tests through it, and the server's
# RenewableEnergyTestHelpers.lua sorts before the handler files that require it. With --mp the
# server loads the server files again too.
