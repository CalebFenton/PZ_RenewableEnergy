MODE_SELECTION_promo=PROMO
# The status window first, so that it reads the same noon figures whatever else the run shoots,
# then the other noon shots, then the garden lights and the poster, which are at night, the poster
# last since it moves the clock on to the next day.
MODE_GROUPS_promo='status menu world icons models trailer biogas woodgas wind treadmill gardenlights poster'
MODE_MARK_art=REArt
MODE_MARK_loot=RELootReport

# The item models need more than the harness's extraction: art/promo/extract.py runs it and crops
# each item out of its floor.
harness_after_promo() {
    "$REPO/art/promo/extract.py" "$CACHE"
    echo "PASS: captures are in $REPO/art/promo/captures"
}

# validate-server.sh runs the options that switch on more of the mod: stash houses with map items
# and houses stocked from the start, the other charge frequency, and the most battery banks. The
# --mp tests run single player's: the defaults, with no banks in rooms and no garden lights growing
# by houses (RenewableEnergyDevHarness.lua's onStart, which sets them on the client only).
harness_server_setup() {
    if [ -n "$MP" ]; then
        cat > "$CACHE/Server/${SERVER_NAME}_SandboxVars.lua" <<EOF
SandboxVars = {
    RenewableEnergy = {
        BatteryBankSpawn = 1,
        GardenLights = 0,
    },
}
EOF
        return
    fi
    cat > "$CACHE/Server/${SERVER_NAME}_SandboxVars.lua" <<EOF
SandboxVars = {
    RenewableEnergy = {
        StashMode = 3,
        ChargeFreq = 2,
        BatteryBankSpawn = 4,
    },
}
EOF
}
# Script and tile warnings name the item, recipe or tileset, and Distributions.lua prints
# "RenewableEnergy: missing" for unknown loot lists. The RenewableEnergy_* battery fields are
# unknown item params on purpose: the game copies them into modData. A debug server logs every
# build-menu entity's name as a missing translation, and its icon as not found, since it loads no
# textures, vanilla's too (DEVELOPMENT.md, Translations).
SERVER_PROBLEMS='RenewableEnergy: missing|^(WARN|ERROR).*(RenewableEnergy[._ ]|renewable_energy)'
SERVER_IGNORE='adding unknown item param "RenewableEnergy_|Missing translation "RenewableEnergy_(BarrelDigester|InsulatedDigester|BrickDome|PrimitiveGasifier|Gasifier|AdvancedGasifier|ScoopRotor|PropellerWood|PropellerPipe|AlternatorWindCharger)|Could not find icon: RenewableEnergy_Build_'

